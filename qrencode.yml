version: '3.8'

x-common-deploy: &common-deploy
  mode: global
  update_config:
    delay: 0s
    order: stop-first
    failure_action: continue
  restart_policy:
    condition: on-failure
    delay: 5s
    max_attempts: 5
    window: 120s

x-deploy: &deploy
  deploy:
    <<: *common-deploy
    placement:
      constraints:
        - node.labels.${APP_NAME}==1

services:
  qrencode:
    <<: [*deploy]
    image: ${DOCKER_REGISTRY}/${DOCKER_REPOSITORY}/${APP_NAME}:latest
    hostname: "qrencode"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
    networks:
      - dmz
      - internal
    # not used, while "dmz" is an external bridge network scope=swarm, these
    # ports are made on the swarm's ingress network, which is currently ipv4
    # only, hence the DOCKER-INGRESS in iptables ipv4 is the only change, not
    # ipv6
    ports:
      - "[::]:2443:443"
    volumes:
      - qrencode-cert:/etc/nginx/certs:ro

networks:
  dmz:
    name: dmz-${APP_NAME}
    external: true
  internal:
    name: internal-${APP_NAME}
    driver: overlay
    attachable: true
    driver_opts:
      encrypted: "1"
      gateway: 10.10.3.1
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 10.10.3.0/24

volumes:
  qrencode-cert:
    name: ${APP_NAME}-https-cert
    external: true
