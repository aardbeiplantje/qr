services:
  qrencode:
    image: ${DOCKER_IMAGE:-local/qrencode/qrencode:latest}
    container_name: qrencode-local-${LOGNAME}
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=4k,mode=1700,uid=100
      - /run:rw,noexec,nosuid,nodev,size=4k,mode=1700,uid=100
      - /var/log/nginx:rw,noexec,nosuid,nodev,size=4k,mode=1700,uid=100
      - /var/lib/nginx/logs:rw,noexec,nosuid,nodev,size=4k,mode=1700,uid=100
    cap_drop:
      - ALL
      - SYS_ADMIN
    cap_add:
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 32m
    memswap_limit: 32m
    cpus: 0.5
    networks:
      dmz-ipv6:
        ipv6_address: "${IPV6_ADDRESS}"
    volumes:
      - cert-volume:/certs:ro
      - ${WORKSPACE}/site:/app/site:ro
    environment:
      TZ: GMT
      LC_ALL: C.UTF-8
      LANG: en_US.UTF-8
      PERL5LIB: ""

networks:
  dmz-ipv6:
    name: dmz-${APP_NAME}-ipv6
    driver: bridge
    enable_ipv6: true
    enable_ipv4: false
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv6: "routed"
      com.docker.network.bridge.name: "${APP_NAME}-dmz0"
      com.docker.network.container_iface_prefix: "dmz"
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.enable_ip6_masquerade: "false"
      com.docker.network.bridge.inhibit_ipv4: "true"
      com.docker.network.driver.mtu: "1500"
    ipam:
      driver: default
      config:
        - subnet: "${IPV6_SUBNET}"
          gateway: "${IPV6_GATEWAY}"

volumes:
  cert-volume:
    name: "${CERT_VOLUME}"
