<!-- static site for QR code generator -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="QR Code Generator">
  <title>QR Code Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background-color: #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      padding: 20px;
      max-width: 600px; /* Limit width for desktops */
      width: 90%; /* Responsive width for smaller screens */
      box-sizing: border-box;
    }

    h1 {
      text-align: center;
      color: #333333;
      font-size: 1.5rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .settings-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
    }

    .settings-group label {
      font-size: 14px;
      font-weight: bold;
      color: #555555;
      flex: 1 1 100px;
    }

    .settings-group input {
      font-size: 14px;
      padding: 5px;
      border: 1px solid #cccccc;
      border-radius: 4px;
      width: 100%;
      box-sizing: border-box;
    }

    textarea {
      font-size: 16px;
      padding: 8px;
      border: 1px solid #cccccc;
      border-radius: 4px;
      width: 100%;
      box-sizing: border-box;
      resize: vertical;
    }

    input[type="checkbox"] {
      width: auto;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    input[type="submit"] {
      background-color: #007bff;
      color: #ffffff;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s ease;
      padding: 10px 20px;
      border-radius: 4px;
      font-size: 16px;
    }

    input[type="submit"]:hover {
      background-color: #0056b3;
    }

    .download-btn {
      display: none;
      padding: 10px 20px;
      background-color: #28a745;
      color: #ffffff;
      text-decoration: none;
      border-radius: 4px;
      transition: background-color 0.3s ease;
      font-size: 16px;
      text-align: center;
    }

    .download-btn:hover {
      background-color: #218838;
    }

    .qr-image {
      margin-top: 20px;
      text-align: center;
    }

    .qr-image img {
      max-width: 100%;
      height: auto;
      border: 1px solid #cccccc;
      border-radius: 4px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.2rem;
      }

      .settings-group {
        flex-direction: column;
        gap: 15px;
      }

      .settings-group label {
        flex: 1 1 auto;
      }

      input[type="submit"], .download-btn {
        width: 100%;
      }
    }

    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
      font-size: 14px;
      display: none; /* Hidden by default */
    }

    .message.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .message.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>QR Code Generator</h1>
    <form id="qrForm">
        <label for="data">Enter data to encode:</label>
        <textarea id="text" name="text" required></textarea>

        <div class="settings-group">
          <label for="margin">Margin:</label>
          <input type="number" id="margin" name="margin" min="0" value="4">

          <label for="size">Size:</label>
          <input type="number" id="size" name="size" min="1" value="10">

          <label for="dpi">DPI:</label>
          <input type="number" id="dpi" name="dpi" min="72" value="72">
        </div>

        <label for="ignorecase">
          <input type="checkbox" id="ignorecase" name="ignorecase" value="1">
          Ignore Case
        </label>

        <label for="logo">
          <input type="checkbox" id="logo" name="logo" value="1">
          Include Logo
        </label>

        <!-- CSRF Token -->
        <input type="hidden" id="csrfToken" name="csrfToken" value="">

        <div class="button-group">
          <input type="submit" value="Generate">
          <a id="downloadButton" class="download-btn" download="qrcode.png">Download</a>
        </div>
    </form>

    <!-- Message area -->
    <div id="message" class="message"></div>

    <div class="qr-image">
      <img id="qrCodeImage" src="" alt="QR Code">
    </div>
  </div>

  <script>
    // Generate a CSRF token and set it in the hidden input field
    function generateCsrfToken() {
      const array = new Uint8Array(16);
      window.crypto.getRandomValues(array);
      return Array.from(array, byte => byte.toString(16).padStart(2, '0')).join('');
    }

    document.getElementById('csrfToken').value = generateCsrfToken();

    // Input sanitization function
    function sanitizeInput(input) {
      const div = document.createElement('div');
      div.textContent = input;
      return div.innerHTML;
    }

    // Function to display messages
    function displayMessage(type, text) {
      const messageElement = document.getElementById('message');
      messageElement.className = `message ${type}`;
      messageElement.textContent = text;
      messageElement.style.display = 'block';
    }

    // Form submission handler
    document.getElementById('qrForm').addEventListener('submit', async function(event) {
      event.preventDefault(); // Prevent the form from submitting traditionally

      // Sanitize inputs
      const textInput = sanitizeInput(document.getElementById('text').value);
      const marginInput = sanitizeInput(document.getElementById('margin').value);
      const sizeInput = sanitizeInput(document.getElementById('size').value);
      const dpiInput = sanitizeInput(document.getElementById('dpi').value);
      const ignorecaseInput = document.getElementById('ignorecase').checked ? 1 : 0;
      const logoInput = document.getElementById('logo').checked ? 1 : 0;
      const csrfToken = document.getElementById('csrfToken').value;

      // Validate inputs
      if (!textInput.trim()) {
        displayMessage('error', 'Text input cannot be empty.');
        return;
      }
      if (marginInput < 0) {
        displayMessage('error', 'Margin must be 0 or greater.');
        return;
      }
      if (sizeInput < 1) {
        displayMessage('error', 'Size must be 1 or greater.');
        return;
      }
      if (dpiInput < 72) {
        displayMessage('error', 'DPI must be 72 or greater.');
        return;
      }

      // Make a POST request to the server to generate the QR code
      const response = await fetch('/qr', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          text: textInput,
          margin: marginInput,
          size: sizeInput,
          dpi: dpiInput,
          ignorecase: ignorecaseInput,
          logo: logoInput,
          csrfToken: csrfToken
        })
      });

      if (response.ok) {
        const blob = await response.blob(); // Assume the server returns the QR code as an image blob
        const qrImageUrl = URL.createObjectURL(blob);

        // Display the QR code image
        const qrImageElement = document.getElementById('qrCodeImage');
        qrImageElement.src = qrImageUrl;
        qrImageElement.parentElement.style.display = 'block';

        // Enable the download button
        const downloadButton = document.getElementById('downloadButton');
        downloadButton.href = qrImageUrl;
        downloadButton.style.display = 'inline-block';

        // Display success message
        displayMessage('success', 'QR Code generated successfully!');
      } else {
        displayMessage('error', 'Failed to generate QR code. Please try again.');
      }
    });
  </script>
</body>
</html>
